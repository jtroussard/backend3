name: Backend CI/CD Deployments

on:
  push:
    branches:
      - deploy-test
  pull_request:
    types: [closed]
    branches:
      - dev
  release:
    types: [published]

jobs:
  deploy-dev:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      # GCP_SERVICE_NAME holds the production service name; for DEV, we'll append "-dev"
      GCP_SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}
      REGION: us-central1
      IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend3
    steps:
      - name: Checkout code at merge commit
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven Packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Build Docker Image using Spring Boot Build Image
        run: mvn spring-boot:build-image -Dspring-boot.build-image.imageName=${IMAGE_NAME}:${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Push Docker Image to Container Registry
        run: docker push ${IMAGE_NAME}:${{ github.sha }}

      - name: Deploy to Cloud Run (DEV)
        run: |
          gcloud run deploy ${GCP_SERVICE_NAME}-dev \
            --image ${IMAGE_NAME}:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --project $GCP_PROJECT_ID \
            --set-env-vars SPRING_PROFILES_ACTIVE=dev \
            --set-secrets=DEV_DB_URL=dev-db-url:latest,DEV_DB_USERNAME=dev-db-username:latest,DEV_DB_PASSWORD=dev-db-password:latest,DEV_JWT_SECRET=dev-jwt-secret:latest

  deploy-prod:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SERVICE_NAME: ${{ secrets.GCP_SERVICE_NAME }}
      REGION: us-central1
      IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/backend3
    steps:
      - name: Checkout code at release tag
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven Packages
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Build Docker Image using Spring Boot Build Image
        run: mvn spring-boot:build-image -Dspring-boot.build-image.imageName=${IMAGE_NAME}:${{ github.sha }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for GCP
        run: gcloud auth configure-docker

      - name: Push Docker Image to Container Registry
        run: docker push ${IMAGE_NAME}:${{ github.sha }}

      - name: Deploy to Cloud Run (PROD)
        run: |
          gcloud run deploy ${GCP_SERVICE_NAME} \
            --image ${IMAGE_NAME}:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --project $GCP_PROJECT_ID \
            --set-env-vars SPRING_PROFILES_ACTIVE=prod \
            --set-secrets=PROD_DB_URL=prod-db-url:latest,PROD_DB_USERNAME=prod-db-username:latest,PROD_DB_PASSWORD=prod-db-password:latest,PROD_JWT_SECRET=prod-jwt-secret:latest
