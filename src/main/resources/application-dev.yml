spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 300000
  jwt:
    expiration: 900000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
    open-in-view: false
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always

logging:
  level:
    root: DEBUG
    org.springframework: ERROR
